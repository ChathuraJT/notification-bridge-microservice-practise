services:
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - gateway
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - whatsapp-service
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: '4001'
      DATABASE_URL: postgres://omni:${POSTGRES_PASSWORD}@postgres:5432/notification_portal
    depends_on:
      postgres:
        condition: service_healthy
  whatsapp-service:
    build: ./services/whatsapp-service
    environment:
      PORT: '4002'
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notification_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d notification_portal"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  redisdata:
